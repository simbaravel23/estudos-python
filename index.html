<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada, Saída e Condicionais</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        h2 {
            color: #d32f2f;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b71c1c;
        }
        #resultado {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Verificação de Idade</h2>
        
        <div class="form-group">
            <label for="nome">Insira seu nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="idade">Insira sua idade:</label>
            <input type="number" id="idade" placeholder="Digite sua idade">
        </div>

        <button onclick="processarDados()">Enviar</button>

        <div id="resultado"></div>
    </div>

    <script>
        function processarDados() {
            // Equivalente ao input() do Python
            let nome = document.getElementById("nome").value;
            let idadeTexto = document.getElementById("idade").value;

            // Validação simples
            if (nome === "" || idadeTexto === "") {
                document.getElementById("resultado").innerHTML = "<span style='color: red;'>Por favor, preencha todos os campos!</span>";
                return;
            }

            // Equivalente ao int() do Python para converter a entrada de texto em número inteiro
            let idade = parseInt(idadeTexto);

            // Equivalente à estrutura condicional if/else do Python da imagem
            let mensagemIdade = "";
            if (idade >= 18) {
                mensagemIdade = "Você é maior de idade.";
            } else {
                mensagemIdade = "Você é menor de idade.";
            }

            // Exibindo o resultado na página combinando os dados e a condicional
            document.getElementById("resultado").innerHTML = `
                Olá, ${nome}!<br>
                Você tem ${idade} anos.<br>
                <strong>${mensagemIdade}</strong>
            `;
        }
    </script>

</body>
</html>
